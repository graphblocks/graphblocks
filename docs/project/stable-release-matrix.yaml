authorityTransition:
  readiness: in-progress-blocked
  decisionStatus: accepted
  decision: docs/specification/decisions/0001-rust-normative-authority.md
  currentCandidateImplementation: phase-scoped-rust-authority
  targetNormativeAuthority: rust
  publicCompilerAuthority: rust
  pythonRole: authoring-facade-and-explicit-reference-oracle
  publicCompilerEntrypoint: graphblocks.compiler.compile_graph
  referenceCompilerEntrypoint: graphblocks.compiler.compile_graph_reference
  implicitReferenceFallback: false
  completedPhases:
    - native-first-public-compiler
    - strict-native-plan-bridge
    - exact-shared-compiler-tck-differential
    - control-plane-library-extraction
  remainingPhases:
    - standalone-canonical-and-schema-facade-authority
    - runtime-protocol-capability-handshake
    - production-scheduler-and-durable-authority
    - supported-installed-native-compiler-tck-and-artifact-evidence
  targetMilestone: phase-2-before-1.0
  blocksTargetRelease: true
  requiredGate: REL-NORMATIVE-AUTHORITY
tierDefinitions:
  stable: Compatibility promise after every applicable release gate passes.
  preview: Shipped for evaluation; documented breaking changes may occur in a minor release.
  internal: Build or verification implementation with no supported public API.
  reserved: Name or future surface only; no usable implementation or compatibility promise.

