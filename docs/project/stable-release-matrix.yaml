      - candidate report is emitted only after every required CI job succeeds and revalidates both evidence files
      - category set, selectors, all-pass counts, attempt-scoped artifact identity, JUnit digest, evidence paths, and source digests are closed
      - report is signed by the candidate CI workflow identity
