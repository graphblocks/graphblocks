tierDefinitions:
  stable: Compatibility promise after every applicable release gate passes.
  preview: Shipped for evaluation; documented breaking changes may occur in a minor release.
  internal: Build or verification implementation with no supported public API.
  reserved: Name or future surface only; no usable implementation or compatibility promise.

profileReleasePolicy:
  readiness: boundary-candidate-enforced
  scope: release-boundary-metadata-only
  conformanceCatalog: src/graphblocks/data/conformance-profiles.yaml
  componentCatalog: src/graphblocks/data/package-catalog.yaml
  recordsAuthority: profiles
  stableTargetReleaseTrack: core
  artifactRoleDefinitions:
    claimOwnerArtifact: compatibility-claim-accountability-not-exclusive-implementation
    implementationArtifacts: shipped-code-participating-in-profile-implementation
    evidenceArtifacts: packaged-conformance-evidence-producers-not-complete-release-evidence
  authorityInheritanceMode: transitive-role-preserving-from-extends
  requiredFields:
    - releaseTrack
    - catalogReleaseTrain
    - claimOwnerArtifact
    - implementationArtifacts
    - evidenceArtifacts
    - authority
    - extends
    - tier
    - promotionGate
    - requiredGates
  extensionRequiredFields: [extensionTrack]
  tracks:
    core:
      profileIds: [GB-C0-SCHEMA, GB-C1-LOCAL-RUNTIME]
      allowedTiers: [stable]
      promotionGate: REL-CORE-PROFILE
      includedInTargetRelease: true
      eligibility:
        portableExecutionSemanticsRequired: true
        minimumIndependentRuntimeImplementations: 2
        providerNeutralTckRequired: true
        providerDatabaseDeploymentPolicyAllowed: false
    extension:
      profileIds: [GB-C2-AI-APPLICATION, GB-C3-GOVERNED-RUNTIME, GB-C4-PRODUCTION, GB-X1-ORCHESTRATION, GB-X2-VOICE, GB-X3-DURABLE-STREAM]
      allowedTiers: [preview]
      promotionGate: REL-EXTENSION-PROFILE
      includedInTargetRelease: false
      independentPromotionRequired: true
      ancestorPromotionRequired: true
      ancestorRequiredGateMode: transitive-union
      promotionEvidenceIdentity: profile-id-bound
      shippedSecurityDefectsRemainReleaseBlocking: true
  externalIntegrationTrack: integrationPromotionPolicy

