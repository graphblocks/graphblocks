[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graphblocks"
version = "1.0.0rc13"
description = "Provider-neutral contracts, tooling, and integrations for GraphBlocks"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
authors = [
  { name = "GraphBlocks contributors" },
]
keywords = ["ai", "workflow", "rag", "graph", "runtime"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23,<5",
  "packaging>=24.0",
  "PyYAML>=6.0",
  "referencing>=0.35,<1",
]

[project.optional-dependencies]
runtime = [
  "graphblocks-runtime>=0.1,<0.2",
]
pdf = [
  "pypdf>=4.0",
]
test = [
  "diff-cover==10.4.1",
  "github-slugger==0.0.3",
  "hypothesis>=6.160,<7",
  "markdown-it-py>=4.2,<5",
  "mypy>=1.15,<2",
  "pytest>=8.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.22",
]

[project.scripts]
graphblocks = "graphblocks.cli:main"

[project.urls]
Homepage = "https://github.com/graphblocks/graphblocks"
Documentation = "https://github.com/graphblocks/graphblocks/tree/main/docs"
Source = "https://github.com/graphblocks/graphblocks"
Issues = "https://github.com/graphblocks/graphblocks/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/graphblocks"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "graphblocks/schemas"
"docs/project/stable-release-matrix.yaml" = "graphblocks/data/stable-release-matrix.yaml"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true
warn_unused_ignores = true
follow_imports = "silent"
files = [
  "src/graphblocks/_canonical_reference.py",
  "src/graphblocks/_immutability.py",
  "src/graphblocks/_json.py",
  "src/graphblocks/_lazy_exports.py",
  "src/graphblocks/_outcome_reference.py",
  "src/graphblocks/_root_compat.py",
  "src/graphblocks/_tool_definition.py",
  "src/graphblocks/_validation.py",
  "src/graphblocks/_version.py",
  "src/graphblocks/admission.py",
  "src/graphblocks/clocks.py",
  "src/graphblocks/conformance.py",
  "src/graphblocks/durable_registry.py",
  "src/graphblocks/leases.py",
  "src/graphblocks/provider_effects.py",
  "src/graphblocks/server_adapter.py",
  "src/graphblocks/server_storage.py",
  "src/graphblocks/sqlite_outbox.py",
  "src/graphblocks/stdlib_blocks.py",
  "src/graphblocks/typed.py",
  "tests/typing/valid_typed_graph.py",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["E402"]
