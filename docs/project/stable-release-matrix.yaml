integrationPromotionPolicy:
  readiness: candidate-enforced
  componentCatalog: src/graphblocks/data/package-catalog.yaml
  recordsAuthority: integrations
  promotionGate: REL-INTEGRATION-PROMOTION
  syntheticTestDoubles:
    - repository-fakes
    - acceptance-harness-adapters
  requiredFields:
    - implementationMaturity
    - supportedAuthentication
    - supportedServiceOrSdkVersions
    - realServiceEvidence
    - retryAndFailureModel
    - promotionGate
  allowedMaturity: [contract-only, test-double, real-adapter]
  allowedAuthentication:
    - none
    - api-key
    - basic
    - bearer
    - oauth2
    - mtls
    - ambient-cloud-identity
    - transport-supplied
  supportCoverage: authentication-version-cartesian-product
  realServiceEvidenceSchema:
    kind: signed-workflow-recipe
    requiredFields:
      - test
      - workflow
      - workflowJob
      - testStep
      - reportStep
      - attestationStep
      - artifactName
      - resultPath
      - reportPath
      - signaturePath
    pathsMustExist: true
    testPathPrefix: tests/
    workflowPathPrefix: .github/workflows/
    artifactPathPrefix: .artifacts/real-service/
    artifactNameBindings:
      - '${{ github.sha }}'
      - '${{ github.run_id }}'
      - '${{ github.run_attempt }}'
    testCommandPrefix: [python, -m, pytest]
    testEvidenceOption: --real-service-evidence
    reportCommandPrefix:
      - python
      - tools/release_supply_chain.py
      - freeze-integration-report
    attestationCommandPrefix: [cosign, sign-blob, --yes]
    uploadAction: actions/upload-artifact@
    actionsMustUseCommitSha: true
    criticalStepsMustBeContiguous: true
    promotionReport:
      releaseEvidenceField: integrationRuns
      reportReferenceField: reportDigest
      requiredFields:
        - integrationId
        - status
        - complete
        - candidateRef
        - candidateCommit
        - test
        - workflow
        - workflowJob
        - testStep
        - runId
        - artifactName
        - result
        - resultDigest
      candidateRevisionBound: true
      candidateFinalClaimEquality: true
      signedByReferencedWorkflow: true
      signatureBundleRequired: true
  templates:
    contractOnly: &integration-contract-only
      implementationMaturity: contract-only
      supportedAuthentication: []
      supportedServiceOrSdkVersions: []
      realServiceEvidence: []
      retryAndFailureModel: caller-owned
      promotionGate: REL-INTEGRATION-PROMOTION
    testDouble: &integration-test-double
      implementationMaturity: test-double
      supportedAuthentication: []
      supportedServiceOrSdkVersions: []
      realServiceEvidence: []
      retryAndFailureModel: deterministic-test-only
      promotionGate: REL-INTEGRATION-PROMOTION

