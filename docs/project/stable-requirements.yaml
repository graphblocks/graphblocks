traceabilityVersion: 3
targetRelease: '1.0'
profileCatalog: ../../src/graphblocks/data/conformance-profiles.yaml
scope: Candidate-stable phase-scoped GB-C0-SCHEMA and GB-C1-LOCAL-RUNTIME claims under the accepted Rust authority transition.
authorityDecision: docs/specification/decisions/0001-rust-normative-authority.md
authorityRoles:
  graphCompiler: rust
  standaloneCanonicalAndSchemaIdentity: rust
  standaloneResourceSchemaValidationAndMigration: rust
  stableLocalRuntimeTarget: rust
  python: authoring-facade-and-explicit-reference-oracle
  implicitReferenceFallback: false
implementationRoleDefinitions:
  normative: Active implementation authority for the named requirement.
  pythonFacadeAndReference: Python authoring facade, deterministic reference, or TCK-oracle implementation.
  targetNormative: Selected future normative implementation whose promotion evidence remains blocked.
normativeSections:
  docs/specification/core/canonical-data-model.md:
    - Values and identity
    - Versions and migration
  docs/specification/core/graph-compilation-runtime.md:
    - Graph validation
    - Local scheduling and outcomes
    - Catalog-backed local invocation
    - Untyped compatibility mode
    - Conditional local execution
    - Local output projection
    - Local timeout and retry
    - Python/native boundary
  docs/specification/core/packages-and-plugins.md:
    - Static discovery
    - Block descriptors
    - Port types and catalog closure
    - Plugin authority and failures
  docs/specification/reference/versioning-and-diagnostics.md:
    - Resource versions
    - Alpha migration boundary
    - Diagnostic contracts
profiles:
  GB-C0-SCHEMA:
    status: normative
    extends: []
    requirements:
      - id: canonical-schema-roundtrip
        clauses:
          - GB-CDM-VALUES-001
          - GB-CDM-NUMBERS-001
        implementations:
          pythonFacadeAndReference:
            - src/graphblocks/canonical.py
            - src/graphblocks/schema.py
          targetNormative:
            - crates/graphblocks-schema/src/lib.rs
            - crates/graphblocks-compiler/src/canonical.rs
        authoritySlices:
          canonicalAndSchemaIdentity:
            status: normative
            authority: rust
            normativeImplementations:
              - crates/graphblocks-schema/src/lib.rs
              - crates/graphblocks-compiler/src/canonical.rs
            pythonFacadeAndReference:
              - src/graphblocks/canonical.py
              - src/graphblocks/schema.py
            installedEvidence:
              - tools/verify_wheelhouse.py
              - tools/release_supply_chain.py
              - tests/test_native_canonical_differential.py
              - tests/test_native_schema_id_differential.py
              - tests/test_wheelhouse_schema_verification.py
              - tests/test_release_supply_chain.py
          resourceSchemaValidationAndMigration:
            status: normative
            authority: rust
            normativeImplementations:
              - crates/graphblocks-schema/src/lib.rs
              - crates/graphblocks-python/src/lib.rs
            pythonFacadeAndReference:
              - src/graphblocks/schema.py
              - src/graphblocks/migration.py
            installedEvidence:
              - tools/verify_wheelhouse.py
              - tools/release_supply_chain.py
              - tests/test_native_resource_schema_differential.py
              - tests/test_native_resource_migration_differential.py
              - tests/test_wheelhouse_schema_verification.py
              - tests/test_release_supply_chain.py
        schemas:
          - schemas/graphblocks.ai/v1/graph.schema.json
          - schemas/graphblocks.ai/v1/plugin-manifest.schema.json
        tckSuites: [schema]
        evidence:
          - tests/test_canonical.py
          - tests/test_canonical_native_facade.py
          - tests/test_native_canonical_differential.py
          - tests/test_schema_values.py
          - tests/test_schema_native_facade.py
          - tests/test_native_schema_id_differential.py
          - tests/test_resource_schema_validation.py
          - tests/test_wheelhouse_schema_verification.py
          - tests/test_release_supply_chain.py
          - tck/schema/cases.json
          - tck/schema/typed-values.json
          - tck/schema/resources.json
      - id: graph-parse-normalize-hash
        clauses:
          - GB-CDM-IDENTITY-001
          - GB-CDM-NORMALIZATION-001
          - GB-GCR-GRAPH-VALIDATION-001
          - GB-GCR-CLOSED-WORLD-001
          - GB-GCR-TYPING-001
          - GB-GCR-PREDICATES-001
          - GB-GCR-ENDPOINTS-001
          - GB-GCR-PLAN-001
          - GB-GCR-SINGLE-WRITER-001
          - GB-GCR-LANGUAGE-BOUNDARY-002
        implementations:
          normative:
            - crates/graphblocks-compiler/src/compiler.rs
            - crates/graphblocks-compiler/src/diagnostics.rs
            - crates/graphblocks-compiler/src/graph.rs
            - crates/graphblocks-python/src/lib.rs
            - packages/graphblocks-runtime/src/graphblocks_runtime/__init__.py
          pythonFacadeAndReference:
            - src/graphblocks/canonical.py
            - src/graphblocks/cli.py
            - src/graphblocks/compiler.py
        schemas:
          - schemas/graphblocks.ai/v1/graph.schema.json
        tckSuites: [compiler]
        evidence:
          - tests/test_canonical.py
          - tests/test_compiler_tck.py
          - tests/test_compiler_validation.py
          - tests/test_compiler_differential.py
          - tests/test_compiler_native_bridge.py
          - tests/test_cli.py
          - compatibility/stable-cli-contracts.json
          - tck/compiler/cases.json
      - id: plugin-manifest-validation
        clauses:
          - GB-PKG-DISCOVERY-001
          - GB-PKG-DESCRIPTORS-001
          - GB-PKG-BLOCK-VERSIONS-001
          - GB-PKG-PREDICATES-001
          - GB-PKG-PORT-TYPES-001
          - GB-PKG-PLUGIN-AUTHORITY-001
        implementations:
          normative:
            - crates/graphblocks-schema/src/lib.rs
            - crates/graphblocks-python/src/lib.rs
            - packages/graphblocks-runtime/src/graphblocks_runtime/__init__.py
          pythonFacadeAndReference:
            - src/graphblocks/plugins.py
            - src/graphblocks/schema.py
        schemas:
          - schemas/graphblocks.ai/v1/plugin-manifest.schema.json
        tckSuites: []
        evidence:
          - tests/test_plugins.py
          - tests/test_descriptor_validation.py
          - tests/test_resource_schema_validation.py
          - tests/test_native_resource_schema_differential.py
          - tests/test_resource_validation_native_facade.py
          - tests/test_wheelhouse_schema_verification.py
          - tck/schema/resources.json
      - id: migration-reader
        clauses:
          - GB-CDM-MIGRATION-001
          - GB-CDM-MIGRATION-002
          - GB-VER-RESOURCE-VERSIONS-001
          - GB-VER-ALPHA-MIGRATION-001
          - GB-VER-DIAGNOSTIC-SEVERITY-001
        implementations:
          normative:
            - crates/graphblocks-compiler/src/graph.rs
            - crates/graphblocks-schema/src/lib.rs
            - crates/graphblocks-python/src/lib.rs
            - packages/graphblocks-runtime/src/graphblocks_runtime/__init__.py
          pythonFacadeAndReference:
            - src/graphblocks/migration.py
        scopeNotes:
          - Graph compiler migration and standalone Graph/PluginManifest migration route through fail-closed Rust authority; explicit Python reference entry points remain available as the oracle.
        schemas:
          - schemas/graphblocks.ai/v1/graph.schema.json
          - schemas/graphblocks.ai/v1/plugin-manifest.schema.json
        tckSuites: []
        evidence:
          - tests/test_migration.py
          - tests/test_plugins.py
          - tests/test_native_resource_migration_differential.py
          - tests/test_migration_native_facade.py
          - tests/test_wheelhouse_schema_verification.py
          - tck/migration/cases.json
  GB-C1-LOCAL-RUNTIME:
    status: normative
    extends:
      - GB-C0-SCHEMA
    requirements:
      - id: deterministic-local-scheduler
        clauses:
          - GB-GCR-SCHEDULING-001
          - GB-GCR-CONDITIONAL-EXECUTION-001
        implementations:
          normative:
            - crates/graphblocks-runtime-core/src/scheduler.rs
            - crates/graphblocks-runtime-core/src/stdlib_runtime.rs
            - crates/graphblocks-python/src/lib.rs
            - packages/graphblocks-runtime/src/graphblocks_runtime/__init__.py
          pythonFacadeAndReference:
            - src/graphblocks/runtime.py
        scopeNotes:
          - Installed authority evidence is accepted only when the native binding advertises the versioned runtime.local.v1 capability before executing the exact Rust/Python runtime differential.
        schemas: []
        tckSuites: [runtime]
        evidence:
          - tests/test_runtime.py
          - tests/test_stdlib_runtime_contracts.py
          - tests/test_testing_package.py
          - packages/graphblocks-testing/src/graphblocks_testing/runners.py
          - packages/graphblocks-testing/src/graphblocks_testing/fixtures/tck/runtime/cases.json
          - tck/runtime/cases.json
      - id: typed-ports
        clauses:
          - GB-GCR-TYPING-001
          - GB-GCR-SCHEDULING-001
          - GB-GCR-LANGUAGE-BOUNDARY-001
        implementations:
          pythonFacadeAndReference:
            - src/graphblocks/compiler.py
            - src/graphblocks/plugins.py
            - src/graphblocks/runtime.py
            - src/graphblocks/typed.py
          targetNormative:
            - crates/graphblocks-runtime-core/src/typed_graph.rs
            - crates/graphblocks-runtime-core/src/typed_value.rs
        schemas: []
        tckSuites: [runtime]
        evidence:
          - tests/test_compiler_validation.py
          - tests/test_descriptor_validation.py
          - tests/test_typed_graph_typing.py
          - tests/test_runtime.py
      - id: outcome
        clauses:
          - GB-GCR-SCHEDULING-001
          - GB-GCR-OUTPUT-PROJECTION-001
        implementations:
          pythonFacadeAndReference:
            - src/graphblocks/outcome.py
            - src/graphblocks/runtime.py
            - src/graphblocks/tools.py
          targetNormative:
            - crates/graphblocks-runtime-core/src/outcome.rs
        authoritySlices:
          applicationEventStreamAdmission:
            status: normative
            authority: rust
            scope: materialized-event-admission-and-projection-only
            normativeImplementations:
              - crates/graphblocks-runtime-core/src/application_event.rs
              - crates/graphblocks-python/src/lib.rs
            pythonFacadeAndReference:
              - src/graphblocks/application_event.py
            installedEvidence:
              - packages/graphblocks-testing/src/graphblocks_testing/runners.py
              - packages/graphblocks-testing/src/graphblocks_testing/cli.py
              - tests/test_testing_package.py
              - tests/test_release_supply_chain.py
            exclusions:
              - raw-fixture-operation-construction
              - constructor-payload-wire-normalization
              - diagnostic-differential
        schemas: []
        tckSuites: [application-events, tool-result]
        evidence:
          - tests/test_outcome_readiness.py
          - tests/test_application_event.py
          - tests/test_tool_facade.py
          - tck/application-events/cases.json
          - tck/tool-result/cases.json
      - id: cancellation
        clauses:
          - GB-GCR-TIMEOUT-RETRY-001
        implementations:
          pythonFacadeAndReference:
            - src/graphblocks/runtime.py
            - src/graphblocks/tools.py
          targetNormative:
            - crates/graphblocks-runtime-core/src/cancellation.rs
            - crates/graphblocks-runtime-core/src/timeout.rs
        schemas: []
        tckSuites: [tool-lifecycle]
        evidence:
          - tests/test_cancellation_runtime.py
          - tests/test_timeout_runtime.py
          - tck/tool-lifecycle/cases.json
      - id: journal
        clauses:
          - GB-GCR-SCHEDULING-001
          - GB-GCR-CONDITIONAL-EXECUTION-001
        implementations:
          normative:
            - crates/graphblocks-runtime-core/src/journal.rs
            - crates/graphblocks-python/src/lib.rs
            - packages/graphblocks-runtime/src/graphblocks_runtime/__init__.py
          pythonFacadeAndReference:
            - src/graphblocks/runtime.py
        schemas: []
        tckSuites: [runtime]
        evidence:
          - tests/test_runtime.py
          - tests/test_runtime_package.py
          - tests/test_testing_package.py
          - packages/graphblocks-testing/src/graphblocks_testing/runners.py
          - packages/graphblocks-testing/src/graphblocks_testing/fixtures/tck/runtime/cases.json
          - tck/runtime/cases.json
      - id: local-flow
        clauses:
          - GB-GCR-CONDITIONAL-EXECUTION-001
          - GB-GCR-TIMEOUT-RETRY-001
          - GB-GCR-RETRY-LIMIT-001
        implementations:
          pythonFacadeAndReference:
            - src/graphblocks/compiler.py
            - src/graphblocks/runtime.py
            - src/graphblocks/tools.py
          targetNormative:
            - crates/graphblocks-runtime-core/src/scheduler.rs
            - crates/graphblocks-runtime-core/src/bounded.rs
        schemas:
          - schemas/graphblocks.ai/v1/graph.schema.json
        tckSuites: [retry, sequence, tool-execution]
        evidence:
          - tests/test_runtime.py
          - tests/test_canonical.py
          - tests/test_stable_graph_schema.py
          - tests/test_timeout_runtime.py
          - tests/test_tool_facade.py
          - tck/retry/cases.json
          - tck/sequence/cases.json
          - tck/tool-execution/cases.json
      - id: local-runtime-api
        clauses:
          - GB-GCR-CATALOG-RUNTIME-001
          - GB-GCR-UNTYPED-COMPAT-001
          - GB-GCR-LANGUAGE-BOUNDARY-001
        implementations:
          normative:
            - packages/graphblocks-runtime/src/graphblocks_runtime/__init__.py
            - crates/graphblocks-python/src/lib.rs
          pythonFacadeAndReference:
            - src/graphblocks/__init__.py
            - src/graphblocks/runtime.py
            - packages/graphblocks-testing/src/graphblocks_testing/__init__.py
            - packages/graphblocks-testing/src/graphblocks_testing/fixture_loading.py
            - packages/graphblocks-testing/src/graphblocks_testing/models.py
            - packages/graphblocks-testing/src/graphblocks_testing/reports.py
            - packages/graphblocks-testing/src/graphblocks_testing/runners.py
        scopeNotes:
          - The stable installed surface is the explicit three-symbol allowlist in compatibility/stable-runtime-surface.yaml; persistence, checkpoint, callback, deployment, raw JSON, and test-runtime helpers remain preview.
          - Installed authority evidence verifies the closed status and result contracts, exact signatures, runtime.local.v1 capability, py.typed marker, stable smoke execution, and selected-wheel bytes without an implicit Python fallback.
        schemas: []
        tckSuites: [runtime]
        evidence:
          - compatibility/stable-python-surface.yaml
          - compatibility/stable-runtime-surface.yaml
          - compatibility/stable-runtime-api.json
          - compatibility/stable-testing-surface.yaml
          - tools/verify_wheelhouse.py
          - tests/test_compatibility_snapshots.py
          - tests/test_runtime_package.py
          - tests/test_testing_package.py
          - tests/test_testing_package_architecture.py
          - tests/test_wheelhouse_schema_verification.py
