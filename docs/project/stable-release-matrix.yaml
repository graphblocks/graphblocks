      claimBoundary: Artifact integrity, provenance, signing, and promotion only; this does not imply runtime security, durability, or adapter readiness.
    - id: api
      label: API and portable contract
      readiness: candidate-contract-review-blocked
      primaryGates: [REL-CORE-PROFILE, REL-API-SNAPSHOT, REL-WIRE-V1, REL-CLOSED-SCHEMA]
      targetReleaseClaim: core-c0-c1-only
      blocksTargetRelease: true
      shippedP0P1RemainBlocking: true
      claimBoundary: C0/C1 compatibility candidate only; preview modules and production-operation behavior remain outside this claim.
    - id: runtime-security
      label: Runtime security
      readiness: code-closure-enforced-external-evidence-blocked
      primaryGates: [REL-AUDIT-REMEDIATION, REL-OBJECT-AUTHORIZATION-REVIEW, REL-ADVERSARIAL-RESOURCE-TESTS]
      targetReleaseClaim: release-wide-shipped-code
      blocksTargetRelease: true
      shippedP0P1RemainBlocking: true
      claimBoundary: The reference server is not a production-ready multi-tenant authority boundary; object authorization and adversarial resource evidence remain mandatory.
    - id: durability
      label: Durability and recovery
      readiness: core-c1-runtime-authority-and-correctness-blocked-production-preview
      primaryGates: [REL-AUDIT-REMEDIATION, REL-NORMATIVE-AUTHORITY, REL-RUNTIME-CORRECTNESS]
      targetReleaseClaim: core-c1-local-runtime-authority
      blocksTargetRelease: true
      shippedP0P1RemainBlocking: true
      claimBoundary: The three remaining C1 requirements and restart-independent local correctness block 1.0; the installed native runtime API, typed-ports requirement, outcome.v1 wire/readiness slice, and all stable C1 exact-differential suites are frozen, while the remaining outcome run-terminal/projection semantics and C4/X3 production durability retain their separate blockers.
    - id: adapters
      label: External adapters
      readiness: contract-only-no-real-adapters
      primaryGates: [REL-INTEGRATION-PROMOTION]
      targetReleaseClaim: excluded-contract-only
      blocksTargetRelease: false
      shippedP0P1RemainBlocking: true
      claimBoundary: Catalogued integrations are contract-only or test doubles; no external service, SDK, authentication mode, or failure model is production-supported.
