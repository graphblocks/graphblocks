    description: Every signed candidate matrix report binds a manifest-selected all-pass pytest/JUnit run for the closed adversarial request, response, schema/regex, YAML-parser, and canonical-number categories against exact candidate test-source digests.
    readiness: evidence-contract-enforced-candidate-runs-outstanding
    blocksTargetRelease: true
    categories:
