profiles:
  - id: GB-C0-SCHEMA
    implementation: rust-native-compiler+python-facade
    tier: stable
    readiness: blocked
    authority: {compiler: rust, authoringAndReferenceOracle: python}
    requiredGates: [REL-WIRE-V1, REL-CLOSED-SCHEMA, REL-CLOSED-WORLD, REL-DIAGNOSTICS, REL-TRACEABILITY, REL-INSTALLED-TCK, REL-NORMATIVE-AUTHORITY]
  - id: GB-C1-LOCAL-RUNTIME
    implementation: rust-native-runtime-target+python-reference-oracle
    tier: stable
    readiness: blocked
    authority: {compiler: rust, productionRuntimeTarget: rust, referenceInterpreter: python}
    extends: [GB-C0-SCHEMA]
    requiredGates: [REL-API-SNAPSHOT, REL-RUNTIME-CORRECTNESS, REL-INSTALLED-TCK, REL-NORMATIVE-AUTHORITY]
  - id: GB-C2-AI-APPLICATION
    extensionImplementation: python-reference
    inheritsCoreAuthority: true
    tier: preview
    roadmap: active
  - id: GB-C3-GOVERNED-RUNTIME
    extensionImplementation: python-reference
    inheritsCoreAuthority: true
    tier: preview
    roadmap: active
    blockers: [fail-closed-policy-decoding, exact-external-codecs, durable-governance-transactions]
  - id: GB-C4-PRODUCTION
    extensionImplementation: python-reference
    inheritsCoreAuthority: true
    tier: preview
    roadmap: active
    blockers: [fail-closed-protected-routes, tenant-scoped-object-authorization, restart-durable-accepted-runs, authenticated-idempotent-resume, worker-crash-recovery, atomic-outbox-claims, retention-and-pagination, resource-execution-budgets, fencing, production-adapter-evidence]
