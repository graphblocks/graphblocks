releaseGates:
  - id: REL-CORE-PROFILE
    description: Only the owned C0/C1 portable contract profiles with explicit active, target, and reference authority roles may join the 1.0 stable release track.
    readiness: candidate-enforced
    releaseTrack: core
    blocksTargetRelease: true
    evidence:
      - src/graphblocks/data/conformance-profiles.yaml
      - docs/project/stable-release-matrix.yaml
      - docs/specification/conformance/profiles.md
      - tests/test_documentation_integrity.py
  - id: REL-EXTENSION-PROFILE
    description: Each application, governance, production, orchestration, voice, or durable profile remains on an independently promoted extension track.
    readiness: definition-blocked
    releaseTrack: extension
    blocksTargetRelease: false
    independentPromotionRequired: true
    ancestorPromotionRequired: true
    ancestorRequiredGateMode: transitive-union
    profileIdentityBoundEvidenceRequired: true
    evidence:
      - src/graphblocks/data/conformance-profiles.yaml
      - docs/project/stable-release-matrix.yaml
      - docs/specification/conformance/profiles.md
      - tests/test_documentation_integrity.py
    blockers:
      - profile-scoped-promotion-evidence-contract-not-frozen
  - id: REL-API-SNAPSHOT
    description: Stable Python signatures and CLI JSON and exit-code contracts are snapshotted.
    readiness: candidate-enforced
    evidence:
      - compatibility/stable-python-surface.yaml
      - compatibility/stable-python-api.json
      - compatibility/stable-cli-cases.yaml
      - compatibility/stable-cli-contracts.json
      - compatibility/stable-testing-surface.yaml
      - compatibility/stable-testing-api.json
      - compatibility/stable-testing-cli-cases.yaml
      - compatibility/stable-testing-cli-contracts.json
      - tools/check_compatibility.py
    blockers: [compatibility-review]
  - id: REL-WIRE-V1
    description: Closed graphblocks.ai/v1 Graph and PluginManifest resources and alpha migrations exist.
    readiness: candidate-enforced
    evidence:
      - schemas/graphblocks.ai/v1/graph.schema.json
      - schemas/graphblocks.ai/v1/plugin-manifest.schema.json
      - src/graphblocks/migration.py
      - tests/test_migration.py
      - tck/migration/cases.json
  - id: REL-CLOSED-SCHEMA
    description: Every stable resource is validated by every claimed stable reader.
    readiness: candidate-enforced
    evidence:
      - schemas/graphblocks.ai/v1/graph.schema.json
      - schemas/graphblocks.ai/v1/plugin-manifest.schema.json
      - src/graphblocks/schema.py
      - src/graphblocks/plugins.py
      - tests/test_schema_values.py
      - tests/test_plugins.py
      - tck/schema/resources.json
  - {id: REL-CLOSED-WORLD, description: Unknown blocks fail compilation by default and discovery is explicitly opt-in.}
  - {id: REL-DIAGNOSTICS, description: All stable diagnostics are registered and compatibility-tested.}
  - id: REL-TRACEABILITY
    description: Every stable normative requirement has executable evidence.
    readiness: candidate-enforced
    evidence:
      - src/graphblocks/data/conformance-profiles.yaml
      - docs/project/stable-requirements.yaml
      - tests/test_stable_traceability.py
  - id: REL-DOCS-INTEGRITY
    description: Every living Markdown path and fragment resolves locally and every declared generated documentation projection is current.
    readiness: candidate-enforced
    blocksTargetRelease: true
    externalNetworkAvailabilityClaimed: false
    evidence:
      - docs/project/generated-documentation.yaml
      - tools/check_docs.py
      - tools/generate_status_readiness.py
      - tools/generate_stdlib_inventory.py
      - tests/test_docs_checker.py
      - pyproject.toml
      - .github/workflows/docs.yml
  - {id: REL-RUNTIME-CORRECTNESS, description: C1 lifecycle cancellation journal bounded-flow and tool gates pass.}
  - id: REL-INTEGRATION-PROMOTION
    description: Integration maturity, authentication, version, failure-model, and candidate-bound signed real-service runs are verified before promotion.
    readiness: candidate-enforced
    evidence:
      - src/graphblocks/data/package-catalog.yaml
      - docs/project/stable-release-matrix.yaml
      - tools/release_supply_chain.py
      - tests/test_documentation_integrity.py
      - tests/test_release_supply_chain.py
  - id: REL-KUBERNETES-OPERATOR
    description: A Kubernetes artifact may claim operator or reconciliation-controller maturity only after controller implementation and lifecycle evidence are revision-bound.
    readiness: definition-blocked
    scope: artifact-promotion
    blocksTargetRelease: false
    artifact: helm:graphblocks-deployment-chart
    currentMaturity: scaffold-only
    requiredEvidence:
      - controller-source-and-signed-oci-image
      - watch-reconcile-status-convergence
      - idempotent-reconcile-and-conflict-retry
      - finalizer-deletion-lifecycle
      - leader-election-and-failover
      - envtest-reconciliation
      - kind-install-and-upgrade
      - crd-version-migration-and-rollback
    currentEvidence:
