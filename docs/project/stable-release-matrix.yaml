    description: An independent reviewer approves the closed object-authorization scope against the exact candidate route manifest and manifest-selected all-pass test/JUnit evidence, then binds every reviewed CI matrix attestation digest.
    readiness: evidence-contract-enforced-review-outstanding
    blocksTargetRelease: true
    scope:
